<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AHR Solutions | Fila do Time</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="appShell"></div>
  <main class="main-content">
    <header class="page-header"><div><p class="eyebrow">Atendimento</p><h1>Fila do Time</h1><p>Chamados aguardando ou em atendimento pela equipe.</p></div></header>
    <section class="card">
      <div class="filters"><select id="queueStatus"><option value="">Todos os status</option><option>Aberto</option><option>Em análise</option><option>Em andamento</option><option>Aguardando solicitante</option></select><select id="queuePriority"><option value="">Todas as prioridades</option><option>Baixa</option><option>Média</option><option>Alta</option><option>Urgente</option></select></div>
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>Solicitante</th><th>Título</th><th>Prioridade</th><th>Status</th><th>Ação</th></tr></thead><tbody id="queueTable"></tbody></table></div>
    </section>
  </main>
  <script src="js/app.js"></script><script src="js/fila.js"></script>
</body>
</html>
